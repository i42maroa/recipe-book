<button class="recipe-card" type="button" (click)="selected.emit(recipe())">
  <span [class]="'recipe-photo ' + photoClass()"><span class="photo-illustration"><app-meal-icon [mealType]="recipe().mealTypes[0] ?? 'Plato'" /></span></span>
  <span class="recipe-card-content">
    <span class="recipe-card-classification">
      <span class="recipe-card-categories">
        <span class="meal-label">{{ recipe().mealTypes.join(' · ') || 'Sin categoría' }}</span>
        @for (cuisine of recipe().cuisineTypes ?? []; track cuisine) {
          <span class="cuisine-tag"><span class="cuisine-flag" aria-hidden="true">{{ cuisineFlag(cuisine) }}</span>{{ cuisine }}</span>
        }
        @if (recipe().pending) { <span class="pending-badge"><i></i> Por probar</span> }
        @if (recipe().fitness) { <span class="fitness-badge">Fitness</span> }
      </span>
      @if (recipe().difficulty) { <span [class]="'difficulty-badge difficulty-' + (recipe().difficulty | difficultyTone)">{{ recipe().difficulty }}</span> }
    </span>
    <span class="recipe-title">{{ recipe().name }}</span>
    <span class="recipe-card-bottom-row">
      <span class="recipe-card-meta">
        @if (recipe().minutes) { <span><app-icon class="meta-icon" name="clock" />{{ recipe().minutes }} min</span> }
        @if (recipe().servings) { <span><app-icon class="meta-icon" name="person" />{{ recipe().servings }}</span> }
        <span>{{ recipe().ingredientIds.length }} ingredientes</span>
      </span>
      @if (recipe().rating) { <span class="rating"><app-icon class="rating-icon" name="star" /> {{ recipe().rating }}</span> }
    </span>
  </span>
</button>
