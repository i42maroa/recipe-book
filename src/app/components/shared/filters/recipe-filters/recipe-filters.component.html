<div class="recipe-controls">
  <app-search-filter placeholder="Busca por nombre de receta…" ariaLabel="Buscar recetas por nombre" [formControl]="search()" />
  <app-select-filter class="recipe-sort" label="Orden" filterType="order" [compact]="true" [options]="sortOptions" [formControl]="sort()" />
  <div class="recipe-extra-filters" role="group" aria-label="Filtros de recetas">
    <app-select-filter label="Tipo de plato" filterType="meal-type" [options]="mealTypeOptions" [formControl]="mealType()" />
    <app-select-filter label="Dificultad" filterType="difficulty" [options]="difficultyOptions" [formControl]="difficulty()" />
    <app-ingredient-filter [selectedIds]="ingredientIds().value" (selectedIdsChange)="ingredientIds().setValue($event)" />
  </div>
</div>
