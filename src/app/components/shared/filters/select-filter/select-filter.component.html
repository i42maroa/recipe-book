<div class="select-filter" [class.opened]="opened" [class.disabled]="disabled" [attr.data-filter-type]="filterType">
  <button class="select-trigger" type="button" role="combobox" aria-haspopup="listbox" [attr.aria-expanded]="opened" [attr.aria-controls]="opened ? selectId + '-options' : null" [attr.aria-activedescendant]="opened && displayOptions.length ? selectId + '-option-' + activeIndex : null" [attr.aria-label]="ariaLabel || label || placeholder || 'Seleccionar opción'" [disabled]="disabled" (click)="toggle()" (keydown)="onKeydown($event)" (blur)="onBlur()">
    @if (label) { <span class="select-label">{{ label }}</span> }
    <span class="select-value">{{ selectedLabel || placeholder }}</span>
    <app-icon class="select-chevron" name="chevron-down" />
  </button>
  @if (opened) {
    <ul class="select-options" role="listbox" [id]="selectId + '-options'" [attr.aria-label]="ariaLabel || label || placeholder || 'Opciones'" (mousedown)="$event.preventDefault()">
      @for (option of displayOptions; track $index; let index = $index) {
        <li class="select-option" role="option" [id]="selectId + '-option-' + index" [attr.aria-selected]="option.value === value" [class.active]="activeIndex === index" [class.selected]="option.value === value" (mouseenter)="activeIndex = index" (click)="updateValue(option.value)">
          <span>{{ option.label }}</span>
          @if (option.value === value) { <app-icon name="check" /> }
        </li>
      }
    </ul>
  }
</div>
