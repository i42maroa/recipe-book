<div class="app-shell" [attr.aria-busy]="loading.isLoading()">
  <app-navbar></app-navbar>
  <main class="main-area">
    <header class="topbar">
      <app-breadcrumb></app-breadcrumb>
      <app-user-session></app-user-session>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
<app-notification-center></app-notification-center>
@if (forms.dialog$ | async; as dialog) {
  <app-base-form
    [formType]="dialog.formType"
    [recipeToEdit]="dialog.recipeToEdit"
    [ingredientToEdit]="dialog.ingredientToEdit"
    (cancel)="forms.close()"
    (recipeSaved)="forms.saveRecipe($event)">
  </app-base-form>
}
@if (loading.isLoading()) {
  <div class="loading-overlay" role="status" aria-live="polite" aria-label="Cargando, espera un momento">
    <div class="loading-indicator">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Cargando…</span>
    </div>
  </div>
}
