<div class="app-shell">
  <app-navbar></app-navbar>
  <main class="main-area">
    <header class="topbar">
      <app-breadcrumb></app-breadcrumb>
      <div class="topbar-actions"><span class="today-label">{{ todayLabel }}</span><span class="topbar-avatar">A</span></div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
<app-notification-center></app-notification-center>
@if (forms.dialog$ | async; as dialog) {
  <app-base-form
    [formType]="dialog.formType"
    [recipeToEdit]="dialog.recipeToEdit"
    [ingredientToEdit]="dialog.ingredientToEdit"
    (cancel)="forms.close()"
    (recipeSaved)="forms.saveRecipe($event)">
  </app-base-form>
}
