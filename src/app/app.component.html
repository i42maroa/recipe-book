<div class="app-shell">
  <app-navbar></app-navbar>
  <main class="main-area">
    <header class="topbar">
      <app-breadcrumb></app-breadcrumb>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
<app-notification-center></app-notification-center>
@if (forms.dialog$ | async; as dialog) {
  @defer (on immediate) {
  <app-base-form
    [formType]="dialog.formType"
    [savingRecipe]="forms.saving()"
    [recipeToEdit]="dialog.recipeToEdit"
    [ingredientToEdit]="dialog.ingredientToEdit"
    (cancel)="forms.close()"
    (recipeSaved)="forms.saveRecipe($event)">
  </app-base-form>
  } @loading {
    <div class="form-loading" role="status">Cargando formulario…</div>
  } @error {
    <div class="form-loading" role="alert">No se pudo cargar el formulario. <button type="button" (click)="forms.close()">Cerrar</button></div>
  }
}
